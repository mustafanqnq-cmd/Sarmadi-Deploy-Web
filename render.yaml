services:
  - type: worker
    runtime: docker
    name: sarmadi-mustafa
    plan: free
    branch: web
    rootDir: .
    dockerCommand: bash ba.sh
    repo: https://github.com/Sarmadi-Mustafa/Sarmadi-Deploy.git
    region: frankfurt
    envVars:
      - key: API_ID
        value: "7219208"
      - key: API_HASH
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: postgres
          property: connectionString
      - key: DATABASE_PUBLIC_URL
        fromDatabase:
          name: postgres
          property: connectionString
      - key: ENV
        value: "."
      - key: GITHUB_TOKEN
        sync: false
      - key: STRING_SESSION
        sync: false
      - key: TG_BOT_TOKEN
        sync: false
      - key: TZ
        value: Asia/Baghdad

databases:
  - name: postgres
    plan: free
    region: frankfurt
